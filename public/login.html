<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrador</title>
    <style>
        body { font-family: Arial, sans-serif; background: #e30613; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; width: 350px; padding: 30px; border-radius: 15px; box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.3); text-align: center; }
        .logo { width: 150px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #e30613; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #msgError { margin-bottom: 10px; font-size: 14px; display: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="logo.png" alt="Logo" class="logo">
        <h2>Panel Admin</h2>
        <div id="msgError"></div>

        <input type="text" id="usuario" placeholder="Usuario">
        <input type="password" id="pass" placeholder="Contraseña">

        <button onclick="ejecutarLogin()">ENTRAR</button>
        <a href="index.html" style="display:block; margin-top:15px; color:#777; text-decoration:none;">← Volver</a>
    </div>

    <script>
        async function ejecutarLogin() {
            const user = document.getElementById("usuario").value;
            const pass = document.getElementById("pass").value;
            const msg = document.getElementById("msgError");

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        nombre_usuario: user, 
                        contrasena: pass 
                    })
                });

                const result = await response.json();

                if (result.success) {
                    window.location.href = "/ventas.html";
                } else {
                    msg.innerText = result.mensaje;
                    msg.style.display = "block";
                    msg.style.color = "red";
                }
            } catch(e) {
                msg.innerText = "Error de conexión";
                msg.style.display = "block";
            }
        }
    </script>
</body>
</html>
