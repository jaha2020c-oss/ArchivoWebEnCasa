<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrador - Como en Casa</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #e30613; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; width: 350px; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; }
        .logo { width: 120px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #e30613; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        button:hover { background: #c10510; }
        #msgError { color: red; font-size: 14px; margin-bottom: 10px; display: none; padding: 10px; background: #ffebee; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="login-box">
        <img src="logo.png" alt="Logo" class="logo">
        <h2>Administración</h2>
        <div id="msgError"></div>

        <input type="text" id="userInput" placeholder="Usuario (admin)">
        <input type="password" id="passInput" placeholder="Contraseña">

        <button onclick="realizarLogin()">ENTRAR</button>
        <a href="index.html" style="display:block; margin-top:20px; color:#999; text-decoration:none; font-size:14px;">← Volver al Menú</a>
    </div>

<script>
    async function realizarLogin() {
        const user = document.getElementById("userInput").value;
        const pass = document.getElementById("passInput").value;
        const msg = document.getElementById("msgError");

        msg.style.display = "none";

        try {
            const response = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    nombre_usuario: user, 
                    contrasena: pass 
                })
            });

            const result = await response.json();

            if (result.success) {
                // CAMBIO AQUÍ: Ahora te lleva al Menú Principal en lugar de Ventas
                window.location.href = "/menu.html";
            } else {
                msg.innerText = result.mensaje;
                msg.style.display = "block";
            }
        } catch(e) {
            msg.innerText = "Error de conexión con el servidor";
            msg.style.display = "block";
        }
    }
</script>


</body>
</html>
