<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal - Como en Casa</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #f3f3f3; }
        .header {
            width: 100%; background: white; display: flex; align-items: center;
            justify-content: center; padding: 25px; min-height: 120px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); position: relative; box-sizing: border-box;
        }
        .header img { width: 90px; position: absolute; left: 25px; }
        .header h2 { font-size: 26px; color: #333; margin: 0; }
        .content { margin-top: 50px; display: flex; justify-content: center; width: 100%; padding: 0 20px; box-sizing: border-box; }
        
        /* Ajustado para 3 tarjetas y un botón de cierre de sesión abajo */
        .cards { display: grid; grid-template-columns: repeat(3, 260px); gap: 25px; max-width: 900px; }
        .card {
            background: white; padding: 30px; text-align: center; border-radius: 12px;
            font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: 0.3s; color: #333; font-size: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .card:hover { transform: translateY(-5px); background: #e8f5e9; color: #4CAF50; }
        .logout { grid-column: span 3; background: #fff5f5; color: #e30613; border: 1px solid #ffcccc; padding: 20px; }
        .logout:hover { background: #e30613; color: white; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="Logo">
        <h2>Menú Principal</h2>
    </div>

    <div class="content">
        <div class="cards">
            <div class="card" onclick="window.location.href='/dashboard'">
                📊 Dashboard General
            </div>

            <div class="card" onclick="window.location.href='/platillos-admin'">
                🍽️ Gestión de Platillos
            </div>

            <div class="card" onclick="window.location.href='/historial-ventas'">
                💰 Módulo de Ventas
            </div>

            <div class="card logout" onclick="cerrarSesion()">
                ❌ Cerrar sesión
            </div>
        </div>
    </div>

    <script>
        function cerrarSesion() {
            localStorage.clear();
            window.location.href = '/login';
        }
    </script>
</body>
</html>
