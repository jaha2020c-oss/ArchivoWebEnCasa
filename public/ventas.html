<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Ventas - Como en Casa</title>
    <style>
        :root { --primary: #4CAF50; --secondary: #e30613; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); display: flex; }
        
        .sidebar { 
            width: 260px; height: 100vh; background: white; padding: 20px; 
            position: fixed; box-shadow: 2px 0 10px rgba(0,0,0,0.1); 
            display: flex; flex-direction: column; box-sizing: border-box;
        }

        .logo { width: 100px; margin: 0 auto 20px; display: block; }
        
        .menu-item { 
            padding: 15px; border-radius: 8px; cursor: pointer; 
            color: #555; margin-bottom: 5px; transition: 0.3s; font-weight: 500;
        }
        .menu-item.active { background: var(--primary); color: white; }
        
        .menu-item.volver {
            margin-top: auto;
            color: var(--secondary);
            border: 2px solid var(--secondary);
            text-align: center;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .menu-item.volver:hover { background: var(--secondary); color: white; }

        .content { margin-left: 260px; padding: 40px; width: 100%; box-sizing: border-box; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: #666; font-size: 12px; text-transform: uppercase; }

        .btn { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; font-weight: bold; }
        .btn-delete { background: #ffebee; color: #c62828; }
        .btn-delete:hover { background: #c62828; color: white; }
        
        /* ESTILOS NUEVOS: Botón de detalles y Modal del recibo */
        .btn-info { background: #e3f2fd; color: #0d47a1; margin-right: 5px; }
        .btn-info:hover { background: #0d47a1; color: white; }
        
        .acciones-container { display: flex; gap: 5px; }
        
        .modal-recibo { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .contenido-recibo { background: white; padding: 25px; border-radius: 12px; width: 360px; font-family: 'Courier New', Courier, monospace; box-shadow: 0px 8px 30px rgba(0,0,0,0.3); position: relative; color: #333; }
        .cerrar-modal { position: absolute; top: 10px; right: 15px; font-size: 26px; cursor: pointer; color: #aaa; font-family: Arial, sans-serif; }
        .cerrar-modal:hover { color: black; }
        .tabla-recibo { width: 100%; text-align: left; margin-top: 15px; font-size: 14px; }
        .tabla-recibo th { background: none; color: #333; font-weight: bold; border-bottom: 2px dashed #333; padding: 5px 0; }
        .tabla-recibo td { padding: 6px 0; border: none; }
        
        .no-data { text-align: center; padding: 30px; color: #888; font-style: italic; }
    </style>
</head>
<body>

    <div class="sidebar">
        <img src="logo.png" alt="Logo" class="logo">
        <div class="menu-item active">📋 Historial de Ventas</div>
        <div class="menu-item volver" onclick="location.href='/menu.html'">↩ VOLVER AL MENÚ</div>
    </div>

    <div class="content">
        <div class="card">
            <h2>Ventas Realizadas</h2>
            <p style="color: #888;">Gestión de registros con fecha y hora exacta (segundos incluidos)</p>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Fecha y Hora</th>
                        <th>Cajero / Cliente</th>
                        <th>Total</th>
                        <th>Método</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="listaVentas">
                    <tr>
                        <td colspan="6" class="no-data">Cargando registros...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="modalRecibo" class="modal-recibo" style="display: none;">
        <div class="contenido-recibo">
            <span class="cerrar-modal" onclick="cerrarRecibo()">&times;</span>
            <h3 style="text-align: center; margin-top: 0;">🏠 COMO EN CASA 🏠</h3>
            <p style="text-align: center; font-size: 12px; margin: -10px 0 15px 0;">Historial de Compras</p>
            <hr style="border: 1px dashed #333;">
            <p><strong>Venta ID:</strong> #<span id="reciboId"></span></p>
            <table class="tabla-recibo">
                <thead>
                    <tr>
                        <th>Cant.</th>
                        <th>Producto</th>
                        <th style="text-align: right;">Subtotal</th>
                    </tr>
                </thead>
                <tbody id="cuerpoRecibo">
                    </tbody>
            </table>
            <hr style="border: 1px dashed #333; margin-top: 20px;">
            <h3 style="text-align: right; margin-bottom: 0;">TOTAL: C$ <span id="reciboTotal"></span></h3>
        </div>
    </div>

    <script>
        async function cargarVentas() {
            try {
                const res = await fetch('/ventas');
                const ventas = await res.json();
                const tabla = document.getElementById('listaVentas');
                
                if (!ventas || ventas.length === 0) {
                   tabla.innerHTML = `<tr><td colspan="6" class="no-data">📭 No hay ventas registradas en el nuevo ciclo de inventario.</td></tr>`;
                   return;
                }

                tabla.innerHTML = '';
                ventas.forEach(v => {
                    // MODIFICACIÓN DE HORA: Convertimos el String ISO directo de SQL para que no desborde las 06:00
                    const t = v.fecha_venta.split(/[- :]/);
                    const fechaObj = new Date(t[0], t[1]-1, t[2], t[3], t[4], t[5]);
                    
                    const fechaExacta = fechaObj.toLocaleString('es-NI', {
                       day: '2-digit', month: '2-digit', year: 'numeric',
                       hour: '2-digit', minute: '2-digit', second: '2-digit',
                       hour12: true
                    });

                    tabla.innerHTML += `
                        <tr>
                            <td>#${v.id_venta}</td>
                            <td>${fechaExacta}</td>
                            <td><strong>${v.nombre_mostrar}</strong></td>
                            <td><strong>C$ ${(v.total_venta || 0).toFixed(2)}</strong></td>
                            <td><span style="background:#eef; color:#333; padding:4px 8px; border-radius:4px; font-size:0.9rem;">${v.metodo_pago}</span></td>
                            <td>
                                <div class="acciones-container">
                                    <button class="btn btn-info" onclick="verDetalles(${v.id_venta})">Detalles</button>
                                    <button class="btn btn-delete" onclick="borrar(${v.id_venta})">Eliminar</button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error("Error al cargar ventas:", err);
                document.getElementById('listaVentas').innerHTML = `<tr><td colspan="6" class="no-data" style="color: red;">⚠️ Error al conectar con el servidor.</td></tr>`;
            }
        }

        // NUEVA FUNCIÓN: Llama al nuevo endpoint del servidor y rellena el recibo
        async function verDetalles(idVenta) {
            try {
                const response = await fetch(`/ventas/${idVenta}/detalles`);
                const detalles = await response.json();
                
                const cuerpoRecibo = document.getElementById('cuerpoRecibo');
                cuerpoRecibo.innerHTML = ''; 
                
                let totalAcumulado = 0;
                document.getElementById('reciboId').innerText = idVenta;
                
                detalles.forEach(item => {
                    totalAcumulado += item.subtotal;
                    cuerpoRecibo.innerHTML += `
                        <tr>
                            <td>${item.cantidad}x</td>
                            <td>${item.nombre_platillo} <br><small style="color:#666;">C$ ${item.precio.toFixed(2)} c/u</small></td>
                            <td style="text-align: right;">C$ ${item.subtotal.toFixed(2)}</td>
                        </tr>
                    `;
                });
                
                document.getElementById('reciboTotal').innerText = totalAcumulado.toFixed(2);
                document.getElementById('modalRecibo').style.display = 'flex';
            } catch (error) {
                console.error("Error al cargar el recibo:", error);
                alert("No se pudieron obtener los detalles de esta venta.");
            }
        }

        function cerrarRecibo() {
            document.getElementById('modalRecibo').style.display = 'none';
        }

        async function borrar(id) {
           if(confirm(`¿Estás seguro de eliminar la venta #${id}?`)) {
               try {
                   const res = await fetch(`/ventas/${id}`, { method: 'DELETE' });
                   if(res.ok) {
                       alert('🗑️ Venta eliminada con éxito');
                       cargarVentas();
                   }
               } catch (error) {
                   console.error("Error al borrar:", error);
               }
           }
        }

        window.onload = cargarVentas;
    </script>
</body>
</html>
