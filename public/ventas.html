<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Ventas - Restaurante</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; display: flex; }
        
        /* Sidebar */
        .sidebar {
            width: 250px; height: 100vh; background: #ffffff;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2); padding: 20px;
            position: fixed; left: 0; top: 0; display: flex; flex-direction: column;
        }
        .logo { width: 120px; display: block; margin-bottom: 15px; }
        .panel-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; text-align: center; }
        .menu-item {
            font-size: 18px; padding: 12px 0; border-bottom: 1px solid #ddd;
            cursor: pointer; color: #333; transition: 0.3s;
        }
        .menu-item:hover { color: #4CAF50; padding-left: 10px; }
        .menu-item.volver { color: red; margin-top: auto; }

        /* Contenido */
        .content { margin-left: 270px; padding: 20px; width: calc(100% - 270px); }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        th { background: #4CAF50; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }

        .btn {
            padding: 8px 15px; border: none; border-radius: 5px;
            cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        .btn-edit { background: #2196F3; color: white; margin-right: 5px; }
        .btn-delete { background: #f44336; color: white; }
        .btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="sidebar">
        <img src="/logo.png" alt="Logo" class="logo">
        <div class="panel-title">Administración</div>
        <div class="menu-item" onclick="location.reload()">Historial de Ventas</div>
        <div class="menu-item volver" onclick="window.location.href = 'menu.html';">Volver al Menú</div>
    </div>

    <div class="content">
        <h2>Historial de Ventas</h2>
        <div class="card">
            <table id="tablaHistorial">
                <thead>
                    <tr>
                        <th>ID Venta</th>
                        <th>Fecha</th>
                        <th>Usuario/Cajero</th>
                        <th>Total (C$)</th>
                        <th>Método de Pago</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tbodyHistorial">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // Función para escapar HTML y evitar errores de seguridad
        function escapeHtml(s) {
            if (!s) return '';
            return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]);
        }

        // Cargar Ventas desde el servidor
        async function loadVentas() {
            try {
                const response = await fetch('/ventas');
                const data = await response.json();
                const tbody = document.getElementById('tbodyHistorial');
                tbody.innerHTML = '';

                data.forEach(v => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${v.id_venta}</td>
                        <td>${new Date(v.fecha_venta).toLocaleString()}</td>
                        <td>${escapeHtml(v.nombre_completo || 'Admin')}</td>
                        <td><strong>C$ ${Number(v.total_venta).toFixed(2)}</strong></td>
                        <td>${escapeHtml(v.metodo_pago)}</td>
                        <td>
                            <button class="btn btn-edit" onclick="editarVenta(${v.id_venta}, '${v.metodo_pago}', ${v.total_venta})">Editar</button>
                            <button class="btn btn-delete" onclick="eliminarVenta(${v.id_venta})">Borrar</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Error cargando historial:", error);
                document.getElementById('tbodyHistorial').innerHTML = '<tr><td colspan="6">Error al cargar datos de Azure</td></tr>';
            }
        }

        // Función para Editar (Llama a app.put en server.js)
        async function editarVenta(id, metodoActual, totalActual) {
            const nuevoMetodo = prompt("Nuevo método de pago (Efectivo/Tarjeta/Transferencia):", metodoActual);
            const nuevoTotal = prompt("Nuevo total de la venta (C$):", totalActual);

            if (nuevoMetodo !== null && nuevoTotal !== null) {
                try {
                    const resp = await fetch(`/ventas/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ metodo_pago: nuevoMetodo, total_venta: nuevoTotal })
                    });
                    if (resp.ok) {
                        alert("Venta #" + id + " actualizada correctamente.");
                        loadVentas();
                    }
                } catch (e) { alert("Error al actualizar"); }
            }
        }

        // Función para Borrar (Llama a app.delete en server.js)
        async function eliminarVenta(id) {
            if (!confirm("¿Estás seguro de eliminar la venta #" + id + "? Esta acción no se puede deshacer.")) return;
            
            try {
                const resp = await fetch(`/ventas/${id}`, { method: 'DELETE' });
                if (resp.ok) {
                    alert("Venta eliminada.");
                    loadVentas();
                } else {
                    alert("Error al borrar. Verifica que el servidor soporte DELETE.");
                }
            } catch (e) { alert("Error de conexión con el servidor."); }
        }

        // Ejecutar al cargar la página
        window.onload = loadVentas;
    </script>
</body>
</html>
