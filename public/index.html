<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Como en Casa - Tip Top Style</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- BARRA SUPERIOR -->
  <header class="top-header">
      <!-- Botón de Canasta actualizado -->
      <button class="cart-button">
          <span class="cart-icon">🛒</span>
          <span class="cart-text">Canasta</span>
      </button>

      <div class="header-right">
          <!-- Se eliminó la social-box según lo solicitado -->
          <a href="login.html" class="admin-link">Administrar</a>
      </div>
  </header>

  <!-- ZONA BLANCA DEL MENÚ -->
  <nav class="nav-bar">
      <div class="logo-container">
          <img src="logo.png" alt="Logo Como en Casa" class="main-logo">
      </div>

      <ul class="nav-links">
          <li><a href="#">INICIO</a></li>
          <li><a href="#">NOSOTROS</a></li>
          <li><a href="#">FRANQUICIAS</a></li>
          <li class="spacer"></li>
          <li><a href="#">PROMOCIONES</a></li>
          <li><a href="#">MENÚ</a></li>
          <li><a href="#">CONTACTO</a></li>
      </ul>
  </nav>

  <!-- SECCIÓN HERO -->
  <section class="hero">
      <div class="hero-image-container">
          <img src="Fondodeinicio.png" alt="Fondo" class="bg-image">
          <h1 class="hero-title">¡Sé Parte de la Gran Familia!</h1>
      </div>
      <div class="red-wave"></div>
  </section>

  <!-- CARTAS DE PROMOCIÓN -->
  <section class="promos-wrapper">
      <div class="promo-card">
          <h3>¿Algo en Especial?</h3>
          <div class="product-icons">
            <div class="icon-item">
                <img src="Dulce.png" alt="Dulce">
                <span>Dulce</span>
            </div>
          </div>
          <div class="card-btns">
              <button class="btn-buy">COMPRAR</button>
              <button class="btn-share">COMPARTIR</button>
          </div>
      </div>

      <div class="promo-card">
          <h3>¡Descubre la Promoción del Día!</h3>
          <p>Disfruta Buenos Momentos a domicilio</p>
          <div class="big-phone">1900-2020</div>
      </div>
  </section>

</body>
</html>
