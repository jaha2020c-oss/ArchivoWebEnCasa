<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Platillos - Como en Casa</title>
    <style>
        :root {
            --primary: #4CAF50;
            --secondary: #e30613;
            --bg: #f4f7f6;
            --text: #333;
            --sidebar-white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: var(--bg);
            display: flex;
        }

        /* --- SIDEBAR (Estilo Ventas.html) --- */
        .sidebar {
            width: 260px;
            height: 100vh;
            background: var(--sidebar-white);
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            position: fixed;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container img {
            width: 120px;
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text);
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--primary);
        }

        .menu-item {
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            color: #555;
            font-weight: 500;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }

        .menu-item:hover {
            background: #e8f5e9;
            color: var(--primary);
        }

        .menu-item.active {
            background: var(--primary);
            color: white;
        }

        .menu-item.volver {
            margin-top: auto;
            color: var(--secondary);
            border: 2px solid var(--secondary);
            justify-content: center;
        }

        .menu-item.volver:hover {
            background: var(--secondary);
            color: white;
        }

        /* --- CONTENIDO PRINCIPAL --- */
        .main-content {
            margin-left: 260px;
            padding: 40px;
            width: 100%;
            box-sizing: border-box;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h2 { color: var(--text); margin-top: 0; }

        /* --- TABLAS Y HERRAMIENTAS --- */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            border-bottom: 2px solid #eee;
            color: #666;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }

        /* --- FORMULARIOS Y BOTONES --- */
        input, select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 100%;
            margin-bottom: 15px;
            font-size: 1rem;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #3d8b40; }

        .btn-outline { 
            background: none; 
            border: 1px solid var(--primary); 
            color: var(--primary); 
        }

        .status-pill {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .status-on { background: #e8f5e9; color: #2e7d32; }
        .status-off { background: #ffebee; color: #c62828; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo-container">
            <img src="logo.png" alt="Como en Casa">
        </div>
        <div class="panel-title">ADMINISTRACIÓN</div>
        
        <div class="menu-item active" id="btn-ver" onclick="showSection('ver')">📋 Inventario</div>
        <div class="menu-item" id="btn-agregar" onclick="showSection('agregar')">➕ Agregar Platillo</div>
        <div class="menu-item" id="btn-editar" onclick="showSection('editar')">✏️ Editar Platillo</div>
        <div class="menu-item volver" onclick="location.href='menu.html'">↩ VOLVER AL MENÚ</div>
    
    </div>

    <div class="main-content">
        <div class="card" id="content-area">
            </div>
    </div>

    <script>
        let currentOrder = 'DESC';

        // Navegación entre secciones
        function showSection(section) {
            // Actualizar botones del sidebar
            document.querySelectorAll('.menu-item').forEach(btn => btn.classList.remove('active'));
            if(section !== 'volver') document.getElementById(`btn-${section}`).classList.add('active');

            const area = document.getElementById('content-area');

            if (section === 'ver') renderVer(area);
            if (section === 'agregar') renderAgregar(area);
            if (section === 'editar') renderEditar(area);
        }

        // --- SECCIÓN: VER INVENTARIO ---
        async function renderVer(container) {
            container.innerHTML = `
                <div class="toolbar">
                    <h2>Inventario de Platillos</h2>
                    <button class="btn btn-outline" onclick="toggleOrder()">
                        📅 Ordenar: ${currentOrder === 'DESC' ? 'Recientes primero' : 'Antiguos primero'}
                    </button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Nombre / Tipo</th>
                            <th>Precio</th>
                            <th>Estado</th>
                            <th>Última Actualización</th>
                        </tr>
                    </thead>
                    <tbody id="lista-platillos"></tbody>
                </table>
            `;
            fetchPlatillos();
        }

        async function fetchPlatillos() {
            const res = await fetch(`/platillos?orden=${currentOrder}`);
            const data = await res.json();
            const tbody = document.getElementById('lista-platillos');
            
            tbody.innerHTML = data.map(p => `
                <tr>
                    <td><strong>${p.nombre_platillo}</strong><br><small style="color:#888">${p.tipo}</small></td>
                    <td><strong>C$ ${p.precio.toFixed(2)}</strong></td>
                    <td>
                        <span class="status-pill ${p.disponible ? 'status-on' : 'status-off'}">
                            ${p.disponible ? 'Disponible' : 'Agotado'}
                        </span>
                    </td>
                    <td style="font-size: 0.9rem; color: #666;">
                        ${p.fecha_actualizacion ? new Date(p.fecha_actualizacion).toLocaleString() : '---'}
                    </td>
                </tr>
            `).join('');
        }

        function toggleOrder() {
            currentOrder = currentOrder === 'ASC' ? 'DESC' : 'ASC';
            showSection('ver');
        }

        // --- SECCIÓN: AGREGAR ---
        function renderAgregar(container) {
            container.innerHTML = `
                <h2>Agregar Nuevo Platillo</h2>
                <form id="formAgregar" style="max-width: 500px;" onsubmit="handleAgregar(event)">
                    <label>Nombre del Platillo</label>
                    <input type="text" id="add_nombre" placeholder="Ej: Gallo Pinto Especial" required>
                    
                    <label>Categoría / Tipo</label>
                    <input type="text" id="add_tipo" placeholder="Ej: Desayunos" required>
                    
                    <label>Precio (Córdobas)</label>
                    <input type="number" id="add_precio" step="0.01" placeholder="0.00" required>
                    
                    <label>Disponibilidad Inicial</label>
                    <select id="add_disp">
                        <option value="Disponible">Disponible</option>
                        <option value="No disponible">No disponible</option>
                    </select>
                    
                    <button type="submit" class="btn btn-primary">🚀 Guardar en Base de Datos</button>
                </form>
            `;
        }

        async function handleAgregar(e) {
            e.preventDefault();
            const payload = {
                nombre: document.getElementById('add_nombre').value,
                tipo: document.getElementById('add_tipo').value,
                precio: document.getElementById('add_precio').value,
                disponible: document.getElementById('add_disp').value
            };

            const res = await fetch('/agregarPlatillo', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert('✅ Platillo guardado exitosamente');
                showSection('ver');
            } else {
                alert('❌ Error al guardar');
            }
        }

        // --- SECCIÓN: EDITAR (BUSCADOR) ---
        function renderEditar(container) {
            container.innerHTML = `
                <h2>Editar Platillo</h2>
                <p>Busca un platillo por su nombre para modificarlo.</p>
                <div class="search-box">
                    <input type="text" id="inputBusqueda" placeholder="Escribe el nombre del platillo..." onkeyup="buscarPlatillo()">
                </div>
                <div id="resultados-busqueda"></div>
            `;
            buscarPlatillo();
        }

        async function buscarPlatillo() {
            const query = document.getElementById('inputBusqueda').value;
            const res = await fetch(`/platillos/buscar?nombre=${query}`);
            const data = await res.json();
            
            const divResultados = document.getElementById('resultados-busqueda');
            if(data.length === 0) {
                divResultados.innerHTML = "<p>No se encontraron coincidencias.</p>";
                return;
            }

            divResultados.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Tipo</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.map(p => `
                            <tr>
                                <td>${p.nombre_platillo}</td>
                                <td>${p.tipo}</td>
                                <td><button class="btn btn-outline" onclick="cargarFormEditar(${p.id_platillo}, '${p.nombre_platillo}', '${p.tipo}', ${p.precio}, ${p.disponible})">Seleccionar</button></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function cargarFormEditar(id, nombre, tipo, precio, disponible) {
            const area = document.getElementById('content-area');
            area.innerHTML = `
                <h2>Modificando: ${nombre}</h2>
                <form id="formEditar" style="max-width: 500px;" onsubmit="handleEditar(event, ${id})">
                    <label>Nombre</label>
                    <input type="text" id="edit_nombre" value="${nombre}" required>
                    <label>Tipo</label>
                    <input type="text" id="edit_tipo" value="${tipo}" required>
                    <label>Precio</label>
                    <input type="number" id="edit_precio" step="0.01" value="${precio}" required>
                    <label>Estado</label>
                    <select id="edit_disp">
                        <option value="Disponible" ${disponible ? 'selected' : ''}>Disponible</option>
                        <option value="No disponible" ${!disponible ? 'selected' : ''}>No disponible</option>
                    </select>
                    <div style="display:flex; gap:10px;">
                        <button type="submit" class="btn btn-primary">Actualizar</button>
                        <button type="button" class="btn btn-outline" onclick="showSection('editar')">Cancelar</button>
                    </div>
                </form>
            `;
        }

        async function handleEditar(e, id) {
            e.preventDefault();
            const payload = {
                id: id,
                nombre: document.getElementById('edit_nombre').value,
                tipo: document.getElementById('edit_tipo').value,
                precio: document.getElementById('edit_precio').value,
                disponible: document.getElementById('edit_disp').value
            };

            const res = await fetch('/editarPlatillo', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert('✅ Cambios guardados');
                showSection('ver');
            }
        }

        // Carga inicial
        window.onload = () => showSection('ver');
    </script>
</body>
</html>
