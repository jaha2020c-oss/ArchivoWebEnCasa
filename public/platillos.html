<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Platillos - Como en Casa</title>
    <style>
        :root {
            --primary: #4CAF50;
            --secondary: #e30613;
            --danger: #ff4d4d;
            --bg: #f4f7f6;
            --text: #333;
            --sidebar-white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: var(--bg);
            display: flex;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 260px;
            height: 100vh;
            background: var(--sidebar-white);
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            position: fixed;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            z-index: 100;
        }

        .logo-container { text-align: center; margin-bottom: 30px; }
        .logo-container img { width: 120px; }

        .panel-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text);
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--primary);
        }

        .menu-item {
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            color: #555;
            font-weight: 500;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }

        .menu-item:hover { background: #e8f5e9; color: var(--primary); }
        .menu-item.active { background: var(--primary); color: white; }

        .menu-item.volver {
            margin-top: auto;
            color: var(--secondary);
            border: 2px solid var(--secondary);
            justify-content: center;
            font-weight: bold;
        }

        .menu-item.volver:hover { background: var(--secondary); color: white; }

        /* --- CONTENIDO --- */
        .main-content {
            margin-left: 260px;
            padding: 40px;
            width: 100%;
            box-sizing: border-box;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        /* --- TABLAS Y BOTONES --- */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #f8f9fa; padding: 15px; text-align: left; border-bottom: 2px solid #eee; color: #666; }
        td { padding: 15px; border-bottom: 1px solid #eee; }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { border: 1px solid var(--primary); color: var(--primary); background: none; }
        .btn-danger { background: var(--danger); color: white; margin-left: 10px; }
        .btn-danger:hover { background: #cc0000; transform: scale(1.05); }

        input, select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 100%;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .status-pill {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .status-on { background: #e8f5e9; color: #2e7d32; }
        .status-off { background: #ffebee; color: #c62828; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo-container"><img src="logo.png" alt="Logo"></div>
        <div class="panel-title">ADMINISTRACIÓN</div>
        <div class="menu-item active" id="btn-ver" onclick="showSection('ver')">📋 Inventario</div>
        <div class="menu-item" id="btn-agregar" onclick="showSection('agregar')">➕ Agregar</div>
        <div class="menu-item" id="btn-editar" onclick="showSection('editar')">✏️ Editar / Borrar</div>
        <div class="menu-item volver" onclick="location.href='/menu.html'">↩ VOLVER AL MENÚ</div>
    </div>

    <div class="main-content">
        <div class="card" id="content-area">
            </div>
    </div>

    <script>
        let currentOrder = 'DESC';

        function showSection(section) {
            document.querySelectorAll('.menu-item').forEach(btn => btn.classList.remove('active'));
            if(document.getElementById(`btn-${section}`)) document.getElementById(`btn-${section}`).classList.add('active');
            
            const area = document.getElementById('content-area');
            if (section === 'ver') renderVer(area);
            if (section === 'agregar') renderAgregar(area);
            if (section === 'editar') renderEditar(area);
        }

        // --- VER INVENTARIO ---
        async function renderVer(container) {
            container.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h2>Inventario de Platillos</h2>
                    <button class="btn btn-outline" onclick="toggleOrder()">Orden: ${currentOrder}</button>
                </div>
                <table>
                    <thead>
                        <tr><th>Nombre</th><th>Precio</th><th>Estado</th><th>Actualización</th></tr>
                    </thead>
                    <tbody id="lista-p"></tbody>
                </table>`;
            const res = await fetch(`/platillos?orden=${currentOrder}`);
            const data = await res.json();
            document.getElementById('lista-p').innerHTML = data.map(p => `
                <tr>
                    <td><strong>${p.nombre_platillo}</strong><br><small>${p.tipo}</small></td>
                    <td>C$ ${p.precio.toFixed(2)}</td>
                    <td><span class="status-pill ${p.disponible ? 'status-on' : 'status-off'}">${p.disponible ? 'Disponible' : 'Agotado'}</span></td>
                    <td>${p.fecha_actualizacion ? new Date(p.fecha_actualizacion).toLocaleString() : '---'}</td>
                </tr>`).join('');
        }

        function toggleOrder() {
            currentOrder = currentOrder === 'ASC' ? 'DESC' : 'ASC';
            showSection('ver');
        }

        // --- AGREGAR ---
        function renderAgregar(container) {
            container.innerHTML = `
                <h2>Agregar Nuevo Platillo</h2>
                <form onsubmit="handleAgregar(event)">
                    <input type="text" id="add_n" placeholder="Nombre" required>
                    <input type="text" id="add_t" placeholder="Tipo (Almuerzo, Bebida...)" required>
                    <input type="number" id="add_p" step="0.01" placeholder="Precio C$" required>
                    <select id="add_d"><option value="Disponible">Disponible</option><option value="No disponible">No disponible</option></select>
                    <button type="submit" class="btn btn-primary">Guardar Platillo</button>
                </form>`;
        }

        async function handleAgregar(e) {
            e.preventDefault();
            const payload = {
                nombre: document.getElementById('add_n').value,
                tipo: document.getElementById('add_t').value,
                precio: document.getElementById('add_p').value,
                disponible: document.getElementById('add_d').value
            };
            const res = await fetch('/agregarPlatillo', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            if(res.ok) { alert('✅ Agregado'); showSection('ver'); }
        }

        // --- EDITAR / ELIMINAR ---
        function renderEditar(container) {
            container.innerHTML = `
                <h2>Editar o Eliminar Platillo</h2>
                <input type="text" id="busq" placeholder="Buscar por nombre..." onkeyup="buscar()">
                <div id="res-busq"></div>`;
        }

        async function buscar() {
            const q = document.getElementById('busq').value;
            const res = await fetch(`/platillos/buscar?nombre=${q}`);
            const data = await res.json();
            document.getElementById('res-busq').innerHTML = `
                <table>
                    ${data.map(p => `
                        <tr>
                            <td>${p.nombre_platillo}</td>
                            <td><button class="btn btn-outline" onclick="formEditar(${p.id_platillo}, '${p.nombre_platillo}', '${p.tipo}', ${p.precio}, ${p.disponible})">Seleccionar</button></td>
                        </tr>`).join('')}
                </table>`;
        }

        function formEditar(id, nombre, tipo, precio, disponible) {
            document.getElementById('content-area').innerHTML = `
                <h2>Modificar: ${nombre}</h2>
                <form onsubmit="handleEditar(event, ${id})">
                    <label>Nombre</label><input type="text" id="ed_n" value="${nombre}" required>
                    <label>Tipo</label><input type="text" id="ed_t" value="${tipo}" required>
                    <label>Precio</label><input type="number" id="ed_p" step="0.01" value="${precio}" required>
                    <label>Estado</label>
                    <select id="ed_d">
                        <option value="Disponible" ${disponible ? 'selected' : ''}>Disponible</option>
                        <option value="No disponible" ${!disponible ? 'selected' : ''}>No disponible</option>
                    </select>
                    <div style="margin-top:20px;">
                        <button type="submit" class="btn btn-primary">Actualizar Cambios</button>
                        <button type="button" class="btn btn-danger" onclick="eliminar(${id}, '${nombre}')">Eliminar Platillo</button>
                        <button type="button" class="btn btn-outline" onclick="showSection('editar')">Cancelar</button>
                    </div>
                </form>`;
        }

        async function handleEditar(e, id) {
            e.preventDefault();
            const payload = {
                id: id,
                nombre: document.getElementById('ed_n').value,
                tipo: document.getElementById('ed_t').value,
                precio: document.getElementById('ed_p').value,
                disponible: document.getElementById('ed_d').value
            };
            const res = await fetch('/editarPlatillo', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            if(res.ok) { alert('✅ Actualizado'); showSection('ver'); }
        }

        async function eliminar(id, nombre) {
            if(confirm(`¿Seguro que quieres ELIMINAR "${nombre}"? Esta acción no se puede deshacer.`)) {
                const res = await fetch(`/eliminarPlatillo/${id}`, { method: 'DELETE' });
                if(res.ok) {
                    alert('🗑️ Platillo eliminado');
                    showSection('ver');
                } else {
                    alert('❌ Error al eliminar');
                }
            }
        }

        window.onload = () => showSection('ver');
    </script>
</body>
</html>
